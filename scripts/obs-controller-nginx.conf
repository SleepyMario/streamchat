# Include only in the HTTPS sleepymario.com server. Never trust forwarded client IPs.
location = /obs { return 301 /obs/; }
location ^~ /obs/ {
    allow 10.77.0.0/24;
    allow fd77:6d61:7269::5/128;
    allow fd77:6d61:7269::7/128;
    deny all;
    if ($http_origin !~ "^(https://sleepymario[.]com)?$") { return 403; }
    if ($http_sec_fetch_site = cross-site) { return 403; }
    proxy_pass http://10.77.0.1:8788;
    proxy_bind 10.77.0.1;
    proxy_set_header Host 10.77.0.1:8788;
    # Origin was checked above; normalize only for the private backend's same-origin guard.
    proxy_set_header Origin http://10.77.0.1:8788;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_buffering off;
}
location = /obs/ {
    allow 10.77.0.0/24;
    allow fd77:6d61:7269::5/128;
    allow fd77:6d61:7269::7/128;
    deny all;
    if ($http_sec_fetch_site = cross-site) { return 403; }
    root /var/www/obs-controller;
    try_files /index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; frame-src https://player.twitch.tv; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
